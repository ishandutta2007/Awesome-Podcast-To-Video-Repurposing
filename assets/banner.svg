<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveBar1 { 0%, 100% { height: 18px; y: 350px; } 50% { height: 48px; y: 320px; } }
      @keyframes waveBar2 { 0%, 100% { height: 35px; y: 333px; } 50% { height: 75px; y: 293px; } }
      @keyframes waveBar3 { 0%, 100% { height: 50px; y: 318px; } 50% { height: 22px; y: 346px; } }
      @keyframes waveBar4 { 0%, 100% { height: 65px; y: 303px; } 50% { height: 85px; y: 283px; } }
      @keyframes waveBar5 { 0%, 100% { height: 28px; y: 340px; } 50% { height: 60px; y: 308px; } }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-left { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .floating-card-right { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
      .ambient-glow-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .ambient-glow-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
      .flow-stream { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
      .bar-1 { animation: waveBar1 1.2s ease-in-out infinite; }
      .bar-2 { animation: waveBar2 1.4s ease-in-out infinite 0.2s; }
      .bar-3 { animation: waveBar3 1.1s ease-in-out infinite 0.4s; }
      .bar-4 { animation: waveBar4 1.5s ease-in-out infinite 0.1s; }
      .bar-5 { animation: waveBar5 1.3s ease-in-out infinite 0.3s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg-grad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Pulsing Glow Orbs (Background layer) -->
  <circle cx="200" cy="90" r="130" fill="#38bdf8" opacity="0.2" filter="url(#glow-cyan)" class="ambient-glow-1" />
  <circle cx="1020" cy="310" r="150" fill="#a855f7" opacity="0.2" filter="url(#glow-purple)" class="ambient-glow-2" />
  <circle cx="600" cy="210" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow-purple)" />

  <!-- Dynamic Connecting Flow Lines (Background) -->
  <path d="M 120 210 Q 300 240 600 210 T 1080 210" fill="none" stroke="url(#primary-grad)" stroke-width="2" class="flow-stream" opacity="0.4" />

  <!-- Animated Soundwave Visualizer Bars at the Bottom (Unobtrusive) -->
  <g fill="url(#wave-grad)" opacity="0.65">
    <!-- Center Left -->
    <rect x="470" y="340" width="6" height="28" rx="3" class="bar-1" />
    <rect x="484" y="325" width="6" height="43" rx="3" class="bar-2" />
    <rect x="498" y="315" width="6" height="53" rx="3" class="bar-4" />
    <rect x="512" y="330" width="6" height="38" rx="3" class="bar-3" />
    <rect x="526" y="320" width="6" height="48" rx="3" class="bar-5" />
    <rect x="540" y="335" width="6" height="33" rx="3" class="bar-1" />
    <rect x="554" y="310" width="6" height="58" rx="3" class="bar-2" />
    <rect x="568" y="300" width="6" height="68" rx="3" class="bar-4" />
    <rect x="582" y="320" width="6" height="48" rx="3" class="bar-3" />
    <rect x="596" y="310" width="6" height="58" rx="3" class="bar-5" />
    <rect x="610" y="300" width="6" height="68" rx="3" class="bar-4" />
    <rect x="624" y="315" width="6" height="53" rx="3" class="bar-2" />
    <rect x="638" y="330" width="6" height="38" rx="3" class="bar-1" />
    <rect x="652" y="320" width="6" height="48" rx="3" class="bar-3" />
    <rect x="666" y="310" width="6" height="58" rx="3" class="bar-5" />
    <rect x="680" y="325" width="6" height="43" rx="3" class="bar-2" />
    <rect x="694" y="335" width="6" height="33" rx="3" class="bar-4" />
    <rect x="708" y="342" width="6" height="26" rx="3" class="bar-1" />
    <rect x="722" y="348" width="6" height="20" rx="3" class="bar-5" />
  </g>

  <!-- Decorative Side Card: Left (Long-form 16:9 Audio/Video Preview) -->
  <g class="floating-card-left" filter="url(#drop-shadow)" opacity="0.88">
    <rect x="52" y="80" width="168" height="108" rx="12" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <!-- 16:9 Screen representation -->
    <rect x="64" y="92" width="144" height="64" rx="6" fill="#0f172a" />
    <polygon points="130,118 144,124 130,130" fill="#38bdf8" />
    <text x="136" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎙️ Long-Form Podcast</text>
  </g>

  <!-- Decorative Side Card: Right (Vertical 9:16 Shorts Preview) -->
  <g class="floating-card-right" filter="url(#drop-shadow)" opacity="0.88">
    <rect x="980" y="72" width="168" height="136" rx="14" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    <!-- 9:16 Phone Screen representation -->
    <rect x="1036" y="82" width="56" height="96" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <!-- Dynamic karaoke subtitle simulation on phone -->
    <rect x="1044" y="146" width="40" height="6" rx="3" fill="#facc15" />
    <rect x="1048" y="156" width="32" height="5" rx="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="1064" cy="116" r="14" fill="#c084fc" opacity="0.3" />
    <text x="1064" y="196" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📱 9:16 Viral Shorts</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges (Guaranteed fully visible & unobscured) -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">✨ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
      Awesome Podcast-To-Video Repurposing
    </text>

    <!-- Gradient Accent Subtitle Line -->
    <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#primary-grad)">
      Turn Long-Form Episodes Into Viral Shorts, Reels &amp; TikToks with AI
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Top SaaS Platforms &amp; Open-Source Tools • Highlight Extraction • Speaker Reframing • Auto Captions
    </text>

    <!-- Capability Highlights / Badges in Foreground -->
    <g transform="translate(600, 268)">
      <!-- Pill 1 -->
      <g transform="translate(-315, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="70" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎙️ AI Clipping</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#818cf8" stroke-width="1.2" />
        <text x="75" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✂️ Speaker Tracking</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#c084fc" stroke-width="1.2" />
        <text x="75" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📱 9:16 Vertical Crop</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#f43f5e" stroke-width="1.2" />
        <text x="72.5" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔥 Kinetic Captions</text>
      </g>
    </g>
  </g>
</svg>
